<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The One Source — Fractal Consciousness</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030308;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #rays-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #rays-canvas:active {
    cursor: grabbing;
  }
  .title-block {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .title-block h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
  }
  .title-block p {
    margin: 4px 0 0;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(180,190,255,0.45);
  }
  .hint {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    pointer-events: none;
    user-select: none;
  }
  .controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .row label {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    width: 90px;
  }
  .row input[type="range"] {
    flex: 1;
  }
  .row span {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    min-width: 30px;
    text-align: right;
  }
  .credit {
    position: absolute;
    bottom: 20px;
    right: 20px;
    text-align: right;
    pointer-events: none;
    user-select: none;
  }
  .credit .quote {
    font-size: 12px;
    font-style: italic;
    color: rgba(255,255,255,0.5);
    margin: 0 0 4px;
    max-width: 220px;
  }
  .credit .byline {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin: 0;
  }
</style>
</head>
<body>

<canvas id="rays-canvas"></canvas>

<div class="title-block">
  <h1>The One Source</h1>
  <p>fractal consciousness, expanding infinitely in all directions</p>
</div>

<div class="hint">drag to rotate · scroll to zoom</div>

<div class="controls">
  <div class="row">
    <label for="ray-count">Emanations</label>
    <input type="range" min="8" max="300" value="90" step="1" id="ray-count" />
    <span id="ray-count-out">90</span>
  </div>
  <div class="row">
    <label for="depth">Fractal depth</label>
    <input type="range" min="0" max="4" value="2" step="1" id="depth" />
    <span id="depth-out">2</span>
  </div>
  <div class="row">
    <label for="branch-count">Branching</label>
    <input type="range" min="2" max="5" value="3" step="1" id="branch-count" />
    <span id="branch-count-out">3</span>
  </div>
</div>

<div class="credit">
  <p class="quote">"Singularity, expressed."</p>
  <p class="byline">Made by Zia</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('rays-canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 14);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // The One Source — a pulsing point of origin at the absolute center
  const coreGeo = new THREE.SphereGeometry(0.16, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  // soft halo around the source
  const haloGeo = new THREE.SphereGeometry(0.4, 24, 24);
  const haloMat = new THREE.MeshBasicMaterial({ color: 0x8fb8ff, transparent: true, opacity: 0.15 });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  scene.add(halo);

  // faint background field of scattered points — the unmanifest field the source expands into
  const fieldCount = 900;
  const fieldPositions = new Float32Array(fieldCount * 3);
  for (let i = 0; i < fieldCount; i++) {
    const r = 20 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    fieldPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    fieldPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    fieldPositions[i * 3 + 2] = r * Math.cos(phi);
  }
  const fieldGeo = new THREE.BufferGeometry();
  fieldGeo.setAttribute('position', new THREE.BufferAttribute(fieldPositions, 3));
  const fieldMat = new THREE.PointsMaterial({ color: 0x5a6fa8, size: 0.05, transparent: true, opacity: 0.4 });
  const field = new THREE.Points(fieldGeo, fieldMat);
  scene.add(field);

  const rayGroup = new THREE.Group();
  scene.add(rayGroup);

  function fibonacciDirections(count) {
    const dirs = [];
    for (let i = 0; i < count; i++) {
      const y = 1 - (i / Math.max(1, count - 1)) * 2;
      const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = Math.PI * (3 - Math.sqrt(5)) * i;
      const x = Math.cos(theta) * radiusAtY;
      const z = Math.sin(theta) * radiusAtY;
      dirs.push(new THREE.Vector3(x, y, z));
    }
    return dirs;
  }

  function randomPerp(dir) {
    const arbitrary = Math.abs(dir.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    const a = new THREE.Vector3().crossVectors(dir, arbitrary).normalize();
    const b = new THREE.Vector3().crossVectors(dir, a).normalize();
    const angle = Math.random() * Math.PI * 2;
    return a.multiplyScalar(Math.cos(angle)).add(b.multiplyScalar(Math.sin(angle)));
  }

  function addSegment(origin, dir, length, colorHue, group) {
    const end = origin.clone().add(dir.clone().multiplyScalar(length));
    const points = [origin.clone(), end];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const color = new THREE.Color();
    color.setHSL(colorHue, 0.6, 0.62);
    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 });
    const line = new THREE.Line(geo, mat);
    group.add(line);
    return end;
  }

  function buildRays(count, depth, branchFactor) {
    while (rayGroup.children.length) {
      const c = rayGroup.children.pop();
      c.geometry.dispose();
      c.material.dispose();
    }
    const baseLength = 4.5;
    const dirs = fibonacciDirections(count);

    dirs.forEach((dir, i) => {
      const hue = 0.58 - (i / count) * 0.2;
      let end = addSegment(new THREE.Vector3(0, 0, 0), dir, baseLength, hue, rayGroup);

      // recursive fractal branching — the source expressing itself again within its own emanation
      let currentPoints = [{ pos: end, dir: dir.clone() }];
      let currentLength = baseLength * 0.55;

      for (let d = 0; d < depth; d++) {
        const nextPoints = [];
        currentPoints.forEach((p) => {
          const numBranches = 1 + Math.floor(Math.random() * (branchFactor - 1));
          for (let b = 0; b < numBranches; b++) {
            const perp = randomPerp(p.dir);
            const spread = 0.35 + Math.random() * 0.4;
            const newDir = p.dir.clone().multiplyScalar(1).add(perp.multiplyScalar(spread)).normalize();
            const newEnd = addSegment(p.pos, newDir, currentLength, hue + d * 0.05, rayGroup);
            nextPoints.push({ pos: newEnd, dir: newDir });
          }
        });
        currentPoints = nextPoints;
        currentLength *= 0.6;
      }
    });
  }

  let rayCount = 90, depth = 2, branchFactor = 3;
  buildRays(rayCount, depth, branchFactor);

  const raySlider = document.getElementById('ray-count');
  const rayOut = document.getElementById('ray-count-out');
  const depthSlider = document.getElementById('depth');
  const depthOut = document.getElementById('depth-out');
  const branchSlider = document.getElementById('branch-count');
  const branchOut = document.getElementById('branch-count-out');

  function rebuild() {
    rayCount = parseInt(raySlider.value, 10);
    depth = parseInt(depthSlider.value, 10);
    branchFactor = parseInt(branchSlider.value, 10);
    rayOut.textContent = rayCount;
    depthOut.textContent = depth;
    branchOut.textContent = branchFactor;
    buildRays(rayCount, depth, branchFactor);
  }
  raySlider.addEventListener('input', rebuild);
  depthSlider.addEventListener('input', rebuild);
  branchSlider.addEventListener('input', rebuild);

  // Drag to rotate
  let isDragging = false, prevX = 0, prevY = 0;
  let rotX = 0, rotY = 0;

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    prevX = e.clientX;
    prevY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', () => { isDragging = false; });
  canvas.addEventListener('pointercancel', () => { isDragging = false; });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX;
    prevY = e.clientY;
    rotY += dx * 0.008;
    rotX += dy * 0.008;
    rotX = Math.max(-1.5, Math.min(1.5, rotX));
  });

  let zoom = 14;
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom += e.deltaY * 0.015;
    zoom = Math.max(3, Math.min(50, zoom));
  }, { passive: false });

  let autoRot = 0;
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    if (!isDragging) {
      autoRot += 0.0015;
    }
    const totalY = rotY + autoRot;
    camera.position.x = zoom * Math.sin(totalY) * Math.cos(rotX);
    camera.position.z = zoom * Math.cos(totalY) * Math.cos(rotX);
    camera.position.y = zoom * Math.sin(rotX);
    camera.lookAt(0, 0, 0);

    // gentle pulse of the source, as if breathing
    const pulse = 1 + Math.sin(t * 1.2) * 0.12;
    core.scale.setScalar(pulse);
    halo.scale.setScalar(pulse * 1.4);
    haloMat.opacity = 0.1 + Math.sin(t * 1.2) * 0.05;

    field.rotation.y += 0.0003;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>

</body>
</html>
